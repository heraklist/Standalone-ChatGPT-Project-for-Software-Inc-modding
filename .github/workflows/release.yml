name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Verify tag matches canonical pack version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('production/manifests/knowledge-pack-manifest.json', encoding='utf-8'))['pack_version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m pytest -v

      - name: Verify repository structure and release gates
        run: python tools/verify_repo.py

      - name: Validate evidence registry
        run: python tools/validate_registry.py production/knowledge/17_EVIDENCE_REGISTRY.json

      - name: Validate eval suites
        run: python tools/validate_evals.py production/evals

      - name: Verify exact-target generation-grade evidence
        run: python tools/validate_exact_target.py

      - name: Build generation-grade release bundle
        run: python tools/build_release.py --generation-grade

      - name: Verify release artifacts before publication
        run: |
          python tools/verify_release_artifacts.py \
            dist/software-inc-mod-studio-project-0.1.0.zip \
            dist/software-inc-mod-studio-project-0.1.0.release-report.json \
            --expected-version 0.1.0

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-inc-mod-studio-v0.1.0
          if-no-files-found: error
          path: |
            dist/software-inc-mod-studio-project-0.1.0.zip
            dist/software-inc-mod-studio-project-0.1.0.release-report.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Software Inc Mod Studio v0.1.0
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/software-inc-mod-studio-project-0.1.0.zip
            dist/software-inc-mod-studio-project-0.1.0.release-report.json
