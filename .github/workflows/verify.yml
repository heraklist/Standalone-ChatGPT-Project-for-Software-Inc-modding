name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SIM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Run tests
        run: python -m pytest -v
      - name: Verify repository structure and release gates
        run: python tools/verify_repo.py
      - name: Validate evidence registry
        run: python tools/validate_registry.py production/knowledge/17_EVIDENCE_REGISTRY.json
      - name: Validate eval suites
        run: python tools/validate_evals.py production/evals
      - name: Verify exact-target template remains fail-closed
        run: python tools/validate_exact_target.py work/corpus/beta-1.8.42/capture-manifest.template.json --structural
      - name: Verify exact-target generation-grade evidence
        run: python tools/validate_exact_target.py
      - name: Build generation-grade release bundle
        run: python tools/build_release.py --generation-grade
      - name: Validate SIM layout
        run: python tools/validate_sim_layout.py
      - name: Validate SIM references
        run: python tools/validate_sim_references.py
      - name: Validate SIM evals
        run: python tools/validate_sim_evals.py production/evals/sim
      - name: Resolve SIM version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(
              Path("production/sim/manifests/sim-manifest.json").read_text(encoding="utf-8")
          )["version"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SIM_VERSION={version}\n")
          PY
      - name: Build SIM Preview release
        run: python tools/build_sim_release.py --channel preview
      - name: Verify SIM Preview release
        shell: bash
        run: python tools/verify_sim_release.py "dist/sim-$SIM_VERSION.zip" "dist/sim-$SIM_VERSION.release-report.json" --expected-version "$SIM_VERSION"
      - name: Build deterministic SIM plugin candidate twice
        shell: bash
        run: |
          mkdir -p dist/sim-plugin-ci
          python tools/build_sim_plugin.py build --repo-root . --source-sha "$SIM_SOURCE_SHA" --output dist/sim-plugin-a > dist/sim-plugin-ci/sim-plugin-a.identity.json
          python tools/build_sim_plugin.py build --repo-root . --source-sha "$SIM_SOURCE_SHA" --output dist/sim-plugin-b > dist/sim-plugin-ci/sim-plugin-b.identity.json
      - name: Validate SIM HEAD portable manifest
        run: python tools/validate_agent_plugin_schema.py dist/sim-plugin-a/plugin.json
      - name: Independently validate deterministic SIM plugin candidates
        shell: bash
        run: |
          python tools/validate_sim_plugin.py check --repo-root . --source-sha "$SIM_SOURCE_SHA" --candidate dist/sim-plugin-a
          python tools/validate_sim_plugin.py check --repo-root . --source-sha "$SIM_SOURCE_SHA" --candidate dist/sim-plugin-b
      - name: Compare SIM plugin candidate identities
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path("dist/sim-plugin-ci/sim-plugin-a.identity.json").read_text(encoding="utf-8"))
          b = json.loads(Path("dist/sim-plugin-ci/sim-plugin-b.identity.json").read_text(encoding="utf-8"))
          assert a["source_commit"] == b["source_commit"]
          assert a["semantic_aggregate_sha256"] == b["semantic_aggregate_sha256"]
          assert a["candidate_tree_sha256"] == b["candidate_tree_sha256"]
          print(f"SIM_PLUGIN_REPRODUCIBLE: {a['candidate_tree_sha256']}")
          PY
      - name: Upload deterministic SIM plugin candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: sim-plugin-candidate-${{ env.SIM_SOURCE_SHA }}
          path: |
            dist/sim-plugin-a
            dist/sim-plugin-ci/sim-plugin-a.identity.json
            dist/sim-plugin-ci/sim-plugin-b.identity.json
          if-no-files-found: error
