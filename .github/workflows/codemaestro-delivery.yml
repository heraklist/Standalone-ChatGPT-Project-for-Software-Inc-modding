name: CodeMaestro DL-001 package

on:
  push:
    branches:
      - 'codemaestro/delivery-dl001-20260922'
  pull_request:
    branches:
      - 'sim/v0.2.1-remediation'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Run full repository verification
        run: |
          python -m pytest -v
          python tools/verify_repo.py
          python tools/validate_registry.py production/knowledge/17_EVIDENCE_REGISTRY.json
          python tools/validate_evals.py production/evals
          python tools/validate_exact_target.py work/corpus/beta-1.8.42/capture-manifest.template.json --structural
          python tools/validate_exact_target.py
          python tools/validate_sim_layout.py
          python tools/validate_sim_references.py
          python tools/validate_sim_evals.py production/evals/sim

      - name: Build canonical generation-grade bundle
        run: python tools/build_release.py --generation-grade

      - name: Build and independently verify SIM Preview
        run: |
          python tools/build_sim_release.py --channel preview
          python tools/verify_sim_release.py dist/sim-0.2.0-preview.zip dist/sim-0.2.0-preview.release-report.json --expected-version 0.2.0-preview

      - name: Assemble complete CodeMaestro delivery
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Software-Inc-Mod-Studio-CodeMaestro-DL-001"
          rm -rf delivery
          mkdir -p "delivery/$ROOT/source" "delivery/$ROOT/build-output"

          git archive --format=tar HEAD | tar -x -C "delivery/$ROOT/source"
          cp -a dist/. "delivery/$ROOT/build-output/"
          cp "delivery/$ROOT/source/.codemaestro/HANDOFF.md" "delivery/$ROOT/HANDOFF.md"

          cat > "delivery/$ROOT/DELIVERY_README.md" <<'EOF'
          # Software Inc Mod Studio — CodeMaestro DL-001

          This delivery contains the complete tracked source snapshot, generated build outputs,
          and the CodeMaestro continuity state required to verify, build, and continue the project.

          Start with:
          - HANDOFF.md
          - source/.codemaestro/PROJECT_STATE.md
          - source/.codemaestro/VERIFICATION.md
          - source/.codemaestro/DELIVERY_MANIFEST.json

          The SIM artifact is a PREVIEW candidate. Live ChatGPT acceptance remains externally gated:
          A01-A05 PASS, A06 FAIL, A07-A12 NOT_TESTED. This package does not claim Stable promotion.
          EOF

          find "delivery/$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "delivery/$ROOT/SHA256SUMS.txt"
          (
            cd delivery
            zip -qr "../CodeMaestro_Software_Inc_Mod_Studio_DL-001.zip" "$ROOT"
          )
          sha256sum CodeMaestro_Software_Inc_Mod_Studio_DL-001.zip > CodeMaestro_Software_Inc_Mod_Studio_DL-001.zip.sha256

      - name: Upload final delivery
        uses: actions/upload-artifact@v4
        with:
          name: codemaestro-dl001-complete-delivery
          path: |
            CodeMaestro_Software_Inc_Mod_Studio_DL-001.zip
            CodeMaestro_Software_Inc_Mod_Studio_DL-001.zip.sha256
          if-no-files-found: error
          retention-days: 7
